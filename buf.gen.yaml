version: v2
plugins:
  - remote: buf.build/bufbuild/es
    out: applications/cashier/src/proto/gen/es
    include_imports: true
    opt:
      - target=ts
      - import_extension=js
  - remote: buf.build/bufbuild/es
    out: applications/oci/src/proto/gen/es
    include_imports: true
    opt:
      - target=ts
      - import_extension=js
  - remote: buf.build/bufbuild/es
    out: applications/outproxy/src/proto/gen/es
    include_imports: true
    opt:
      - target=ts
      - import_extension=js
  - remote: buf.build/grpc/go:v1.5.1
    out: infrastructure/pkg/proto/gen/go
    include_imports: true
    opt:
      - paths=source_relative
  - remote: buf.build/protocolbuffers/go:v1.36.5
    out: infrastructure/pkg/proto/gen/go
    include_imports: true
    opt:
      - paths=source_relative
  - remote: buf.build/connectrpc/go:v1.18.1
    out: infrastructure/pkg/proto/gen/go
    include_imports: true
    opt:
      - paths=source_relative
