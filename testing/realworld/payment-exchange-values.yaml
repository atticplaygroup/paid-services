tokenIssuer: https://exchange.realworld.test
tokenCoinEnvironment: 2
env:
  accountDomains: [account.realworld-exchange-envoy, account.realworld-exchange-envoy.realworld-payments.svc.cluster.local]
meter:
  fullnameOverride: realworld-exchange-meter
  exchangeDatabaseURL: postgres://postgres:realworld-test@realworld-postgres:5432/paid?sslmode=disable
  account:
    faucetMode: false
    validCoinEnvironment: 2
  authz:
    allowZeroBalanceHTUs:
      - /account.v1.AccountService/GetBalance
