apiVersion: batch/v1
kind: Job
metadata: {name: e2e-realworld, namespace: puller-ns}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 2400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: tests
          image: local/realworld:dev
          volumeMounts:
            - {name: keys, mountPath: /etc/dpop-keys, readOnly: true}
            - {name: fixture, mountPath: /etc/realworld, readOnly: true}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: keys
          secret: {secretName: e2e-dpop-keys}
        - name: fixture
          configMap: {name: realworld-fixture}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 256Mi}
