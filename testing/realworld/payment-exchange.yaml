apiVersion: v1
kind: Namespace
metadata:
  name: realworld-payments
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realworld-postgres
  namespace: realworld-payments
spec:
  selector:
    matchLabels: {app: realworld-postgres}
  template:
    metadata:
      labels: {app: realworld-postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_PASSWORD, value: realworld-test}
            - {name: POSTGRES_DB, value: paid}
          ports:
            - {containerPort: 5432}
          readinessProbe:
            exec:
              command: [pg_isready, -U, postgres, -d, paid]
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: realworld-postgres
  namespace: realworld-payments
spec:
  selector: {app: realworld-postgres}
  ports:
    - {port: 5432, targetPort: 5432}
