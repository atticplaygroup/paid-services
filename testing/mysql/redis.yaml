apiVersion: apps/v1
kind: Deployment
metadata: {name: replica-meter-redis, namespace: replica-ns}
spec:
  selector:
    matchLabels: {app: replica-meter-redis}
  template:
    metadata:
      labels: {app: replica-meter-redis}
    spec:
      containers:
        - name: redis
          image: valkey/valkey:8-alpine
          ports: [{containerPort: 6379}]
---
apiVersion: v1
kind: Service
metadata: {name: replica-meter-redis, namespace: replica-ns}
spec:
  selector: {app: replica-meter-redis}
  ports: [{port: 6379, targetPort: 6379}]
