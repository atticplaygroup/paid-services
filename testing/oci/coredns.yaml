apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
           lameduck 5s
        }
        ready
        rewrite name exact account.storage-provider-envoy.storage-provider-ns.svc.cluster.local storage-provider-meter-account.storage-provider-ns.svc.cluster.local
        rewrite name exact account.oci-provider-envoy.oci-provider-ns.svc.cluster.local oci-provider-meter-account.oci-provider-ns.svc.cluster.local
        kubernetes cluster.local in-addr.arpa ip6.arpa {
           pods insecure
           fallthrough in-addr.arpa ip6.arpa
           ttl 30
        }
        prometheus :9153
        forward . /etc/resolv.conf {
           max_concurrent 1000
        }
        cache 30
        loop
        reload
        loadbalance
    }
