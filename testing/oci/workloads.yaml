---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pusher-outproxy
  namespace: pusher-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pusher-outproxy
  template:
    metadata:
      labels:
        app: pusher-outproxy
    spec:
      containers:
        - name: outproxy
          image: local/outproxy:dev
          imagePullPolicy: IfNotPresent
          command: ["bun", "run", "src/server.ts"]
          env:
            - name: LISTEN_ADDR
              value: ":9090"
            - name: CA_CERT_PATH
              value: /etc/outproxy/tls/ca.crt
            - name: TLS_CERT_PATH
              value: /etc/outproxy/tls/tls.crt
            - name: TLS_KEY_PATH
              value: /etc/outproxy/tls/tls.key
            - name: TLS_CA_CERT_PATH
              value: /etc/outproxy/tls/ca.crt
            - name: DPOP_MASTER_SECRET
              value: "legal winner thank year wave sausage worth useful legal winner thank yellow"
          volumeMounts:
            - name: outproxy-tls
              mountPath: /etc/outproxy/tls
              readOnly: true
          ports:
            - name: http
              containerPort: 9090
      volumes:
        - name: outproxy-tls
          secret:
            secretName: outproxy-tls
---
apiVersion: v1
kind: Service
metadata:
  name: pusher-outproxy
  namespace: pusher-ns
spec:
  selector:
    app: pusher-outproxy
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pusher-oci
  namespace: pusher-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pusher-oci
  template:
    metadata:
      labels:
        app: pusher-oci
    spec:
      enableServiceLinks: false
      containers:
        - name: oci
          image: local/oci:dev
          imagePullPolicy: IfNotPresent
          command: ["bun", "run", "src/index.ts"]
          env:
            - name: PORT
              value: "3000"
            - name: KVSTORE_ADDRESS
              value: https://storage-provider-envoy.storage-provider-ns.svc.cluster.local:8443
            - name: DISABLE_METERING
              value: "true"
            - name: OUTPROXY_ADDRESS
              value: http://pusher-outproxy.pusher-ns.svc.cluster.local:9090
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/outproxy-ca/ca.crt
            - name: DPOP_MASTER_SECRET
              value: "legal winner thank year wave sausage worth useful legal winner thank yellow"
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: outproxy-ca
              mountPath: /etc/outproxy-ca
              readOnly: true
      volumes:
        - name: outproxy-ca
          secret:
            secretName: outproxy-tls
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: pusher-oci
  namespace: pusher-ns
spec:
  selector:
    app: pusher-oci
  ports:
    - name: http
      port: 3000
      targetPort: http
---
