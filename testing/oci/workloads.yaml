apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-provider-redis
  namespace: storage-provider-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage-provider-redis
  template:
    metadata:
      labels:
        app: storage-provider-redis
    spec:
      containers:
        - name: redis
          image: valkey/valkey:8-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: storage-provider-redis
  namespace: storage-provider-ns
spec:
  selector:
    app: storage-provider-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
