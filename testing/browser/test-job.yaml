apiVersion: batch/v1
kind: Job
metadata: {name: e2e-browser, namespace: puller-ns}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: tests
          image: local/browser-test-client:dev
          command: [bun, test, testing/browser/e2e-browser.test.ts]
          volumeMounts:
            - {name: keys, mountPath: /etc/dpop-keys, readOnly: true}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: keys
          secret: {secretName: e2e-dpop-keys}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 256Mi}
