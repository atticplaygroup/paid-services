apiVersion: batch/v1
kind: Job
metadata: {name: e2e-realworld-papp, namespace: puller-ns}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 4200
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: tests
          image: local/realworld-papp:dev
          env:
            - {name: PAPP_BROWSER, value: chrome}
            - {name: DATABASE_URL, value: 'mysql://root:root@mysql-proposer.pusher-ns.svc.cluster.local:3306/realworld'}
          command: [bun, test, --timeout, "3600000", testing/realworld-papp/e2e-realworld-papp.test.ts, testing/realworld-papp/upstream-pagination.test.ts]
          volumeMounts:
            - {name: keys, mountPath: /etc/dpop-keys, readOnly: true}
            - {name: fixture, mountPath: /etc/realworld-papp, readOnly: true}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: keys
          secret: {secretName: e2e-dpop-keys}
        - name: fixture
          configMap: {name: realworld-papp-fixture}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 256Mi}
