apiVersion: batch/v1
kind: Job
metadata: {name: seed-realworld-papp, namespace: puller-ns}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: local/realworld-papp:dev
          command: [bun, testing/realworld-papp/seed.ts]
          volumeMounts: [{name: keys, mountPath: /etc/dpop-keys, readOnly: true}]
      volumes:
        - name: keys
          secret: {secretName: e2e-dpop-keys}
