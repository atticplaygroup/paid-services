apiVersion: batch/v1
kind: Job
metadata: {name: seed-routing, namespace: oci-provider-ns}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: local/routing-test-client:dev
          command: [bun, routing/seed.ts]
          volumeMounts:
            - {name: keys, mountPath: /etc/dpop-keys, readOnly: true}
      volumes:
        - name: keys
          secret: {secretName: e2e-dpop-keys}
