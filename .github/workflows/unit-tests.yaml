name: Unit tests

on:
  workflow_call:
  workflow_dispatch:

jobs:
  typescript:
    name: TypeScript (${{ matrix.application }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        application: [cashier, outproxy, oci]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Run application unit tests
        working-directory: applications/${{ matrix.application }}
        run: |
          bun install --frozen-lockfile
          bun test src

  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare runner paths
        run: mkdir -p "$RUNNER_TOOL_CACHE"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run Go unit and database contract tests
        run: go test -count=1 ./...
