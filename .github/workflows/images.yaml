name: Images and releases

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional release version, e.g. v0.1.123; empty builds development images'
        required: false
        default: ''
        type: string
      publish:
        description: 'Publish images and release charts to the configured registry'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref && format('refs/heads/{0}', github.head_ref) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/master') }}

jobs:
  tests:
    uses: ./.github/workflows/unit-tests.yaml
  metadata:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.images.outputs.tag }}
      version: ${{ steps.images.outputs.version }}
      prefix: ${{ steps.images.outputs.prefix }}
      publish: ${{ steps.images.outputs.publish }}
      developmentAlias: ${{ steps.images.outputs.developmentAlias }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Resolve image tags
        id: images
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
          CI_SHA: ${{ github.sha }}
          CI_PR_NUMBER: ${{ github.event.number }}
          CI_RELEASE_VERSION: ${{ inputs.release_version }}
          IMAGE_PREFIX: ${{ vars.IMAGE_PREFIX }}
          CI_PUBLISH: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish == true) || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        run: bun run scripts/release/images.ts
      - name: Validate release tooling
        run: bun test scripts/release/release.test.ts

  build:
    needs: [metadata, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: [infrastructure, cashier, outproxy, oci, mysql-tools, s3-retention-rules]
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        if: needs.metadata.outputs.publish == 'true' && startsWith(needs.metadata.outputs.prefix, 'ghcr.io/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and optionally publish image
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_PREFIX: ${{ needs.metadata.outputs.prefix }}
          IMAGE_TAG: ${{ needs.metadata.outputs.tag }}
          PUBLISH_IMAGES: ${{ needs.metadata.outputs.publish }}
          DEVELOPMENT_ALIAS: ${{ needs.metadata.outputs.developmentAlias }}
        run: bash scripts/release/build-image.sh

  release-charts:
    if: needs.metadata.outputs.version != '' && needs.metadata.outputs.publish == 'true'
    needs: [metadata, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: Azure/setup-helm@v4
        with:
          version: v3.18.6
      - name: Log in to GHCR
        if: startsWith(needs.metadata.outputs.prefix, 'ghcr.io/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package verified release charts
        env:
          IMAGE_PREFIX: ${{ needs.metadata.outputs.prefix }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: bun run scripts/release/release.ts "$RELEASE_VERSION"
      - name: Publish OCI charts
        env:
          IMAGE_PREFIX: ${{ needs.metadata.outputs.prefix }}
        run: |
          for package in .release/packages/*.tgz; do
            helm push "$package" "oci://$IMAGE_PREFIX/charts"
          done
