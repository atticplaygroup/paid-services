name: Helm charts

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref && format('refs/heads/{0}', github.head_ref) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/master') }}

jobs:
  release-tooling:
    name: Release chart tooling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Test release metadata and chart packaging
        run: bun test scripts/release/release.test.ts
  rendered-charts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: Azure/setup-helm@v4
        with:
          version: v3.18.6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Check rendered release chart images
        run: bun test scripts/release/chart-render.test.ts
