apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "meter.fullname" . }}-account-config
  namespace: {{ .Release.Namespace }}
data:
  .env: |
    GRPC_PORT=8080
    REDIS_HOST={{ .Values.redis.host | default (include "meter.fullname" . | printf "%s-redis") }}
    REDIS_PORT=6379
    USER_ID_HEADER_NAME=x-user-id
    REQUEST_ID_HEADER_NAME=x-request-id
    TRUSTED_ISSUERS={{ .Values.account.trustedIssuers | toJson | quote }}
    VALID_AUDIENCE={{ .Values.account.validAudience }}
    VALID_COIN_TYPE={{ .Values.account.validCoinType }}
    VALID_COIN_ENVIRONMENT={{ .Values.account.validCoinEnvironment }}
    FAUCET_MODE={{ .Values.account.faucetMode }}
    BALANCE_BACKEND={{ .Values.balanceBackend }}
    EXCHANGE_DATABASE_URL={{ .Values.exchangeDatabaseURL | quote }}
