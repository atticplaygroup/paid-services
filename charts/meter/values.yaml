# Supply the application image repository and a deployment-owned version.
image:
  repository: ghcr.io/atticplaygroup/paid-services/infrastructure
  # Defaults to Chart.appVersion; CI supplies a commit-specific tag.
  tag: ""
  pullPolicy: IfNotPresent
fullnameOverride: ""
balanceBackend: redis
exchangeDatabaseURL: ""
redis:
  enabled: false
  seedJobEnabled: true
  host: "" # host: meter-redis
  address: "" # address: meter-redis:6379
account:
  trustedIssuers: []
    # - issuer: https://exchange.example.com
    #   jwksUrl: https://exchange.example.com/.well-known/jwks.json
  validAudience: ""
  validCoinType: 1
  validCoinEnvironment: 4
  faucetMode: false
deduction:
  feedbackEnabled: false
  feedbackTTLSeconds: 10
  outproxyAddress: ""
authz:
  allowZeroBalanceHTUs:
    - /kvstore.v1.MeteredStorageService/Ping
    - /account.v1.AccountService/DepositOrCreateAccount
    - /account.v1.AccountService/CreditBalance
priceSeed:
  entries: []
