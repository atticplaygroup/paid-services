# TODO(prod): pin digests; no mutable tags in examples
image:
  repository: oci.example.com/infrastructure
  tag: dev
  pullPolicy: IfNotPresent
fullnameOverride: ""
balanceBackend: redis
exchangeDatabaseURL: ""
redis:
  enabled: false
  seedJobEnabled: true
  host: "" # host: meter-redis
  address: "" # address: meter-redis:6379
account:
  validExchangeHosts: []
    # - exchange:8080
  validAudience: ""
  validCoinType: 1
  validCoinEnvironment: 4
  faucetMode: false
als:
  feedbackEnabled: false
  feedbackTTLSeconds: 10
  outproxyAddress: ""
authz:
  allowZeroBalanceHTUs:
    - /kvstore.v1.MeteredStorageService/Ping
    - /account.v1.AccountService/DepositOrCreateAccount
    - /account.v1.AccountService/CreditBalance
priceSeed:
  entries: []
