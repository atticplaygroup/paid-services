namespace: replica-ns
image:
  repository: ghcr.io/atticplaygroup/paid-services/mysql-tools
  # Defaults to Chart.appVersion; CI supplies a commit-specific tag.
  tag: ""
  pullPolicy: IfNotPresent
persistence:
  size: 1Gi
mysql:
  rootPassword: root
importer:
  storageSize: 5Gi # pending delta downloads and queue metadata
  storageMode: s3
  schedule: "*/5 * * * *"
  applicationOwner: ""
  application: medium
  ociAddress: "" # envoy-s:8080
  stagingNamespace: staging
  manifestRepo: app-manifests

s3:
  bucket: mysql-replica
  prefix: mysql
  region: us-east-1
  endpoint: "" # Defaults to the chart's SeaweedFS service when enabled.
  credentialsSecret: "" # External S3: AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
  seaweedfs:
    enabled: true
    image: chrislusf/seaweedfs:3.97
    storageSize: 20Gi
    accessKey: replica
    secretKey: change-me
