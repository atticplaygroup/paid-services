image:
  repository: ghcr.io/atticplaygroup/paid-services/infrastructure
  # Defaults to Chart.appVersion; CI supplies a commit-specific tag.
  tag: ""
  pullPolicy: IfNotPresent
envoyImage:
  repository: envoyproxy/envoy
  tag: v1.38.3
  pullPolicy: IfNotPresent
fullnameOverride: ""
databaseURL: "" # postgres://postgres:postgres@exchange-postgres:5432/paid?sslmode=disable
accountTtlPrice: "0"
withdrawRecipientCount: "10"
withdrawCheckStatusCount: "10"
suiNetwork: devnet
identitySecret: "" # existing Secret with tokenSigningSeed and walletMnemonic keys
tokenSigningSeed: ""
tokenIssuer: ""
# Public Ed25519 keys retained while previously issued tokens can still be valid.
# Each entry is {kid: "...", x: "<base64url-public-key>"}.
tokenRetiredPublicKeys: []
walletMnemonic: ""
messageAuthTimeout: "10s"
maxDepositEpochGap: "10"
maxExpirationExtension: "86400"
sessionTimeout: "10m"
tokenTtl: "10m"
grpcPort: 8080
userIdHeaderName: x-user-id
requestIdHeaderName: x-request-id
tokenCoinType: 1
tokenCoinEnvironment: 4
env:
  accountDomains: []
  # - account.exchange.example.com
  # - account.envoy
  providerManifest: "{}"
meter:
  fullnameOverride: exchange-meter
  balanceBackend: exchange-db
  exchangeDatabaseURL: ""
  redis:
    enabled: false
    seedJobEnabled: false
    host: "" # exchange-redis
    address: "" # exchange-redis:6379
  account:
    trustedIssuers: []
    # - issuer: https://exchange.example.com
    #   jwksUrl: https://exchange.example.com/.well-known/jwks.json
    validAudience: ""
    validCoinType: 1
    validCoinEnvironment: 4
    faucetMode: false
  deduction:
    feedbackEnabled: false
    feedbackTTLSeconds: 10
    outproxyAddress: ""
  authz:
    allowZeroBalanceHTUs:
      - /kvstore.v1.MeteredStorageService/Ping
      - /account.v1.AccountService/DepositOrCreateAccount
      - /account.v1.AccountService/CreditBalance
      - /exchange.v1.ExchangeService/Ping
      - /exchange.v1.ExchangeService/ListPaymentMethods
      - /exchange.v1.ExchangeService/GetChallenge
      - /exchange.v1.ExchangeService/Deposit
  priceSeed:
    entries: []
