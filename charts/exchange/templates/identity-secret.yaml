{{- if not .Values.identitySecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "exchange.fullname" . }}-identity
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  tokenSigningSeed: {{ required "exchange.tokenSigningSeed is required unless identitySecret is supplied" .Values.tokenSigningSeed | quote }}
  walletMnemonic: {{ required "exchange.walletMnemonic is required unless identitySecret is supplied" .Values.walletMnemonic | quote }}
{{- end }}
