# Supply the application image repository and a deployment-owned version.
image:
  repository: ghcr.io/atticplaygroup/paid-services/infrastructure
  # Defaults to Chart.appVersion; CI supplies a commit-specific tag.
  tag: ""
  pullPolicy: IfNotPresent
envoyImage:
  repository: envoyproxy/envoy
  tag: v1.38.3
  pullPolicy: IfNotPresent
fullnameOverride: ""
s3:
  # External S3 is the production default; embedded storage is opt-in.
  enabled: false
  image:
    repository: chrislusf/seaweedfs
    tag: '4.48'
    digest: sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    pullPolicy: IfNotPresent
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  endpoint: "" # defaults to <fullname>-s3:9000 when enabled
  secure: true # use false only for an explicitly configured HTTP endpoint
  bucket: applications
  existingSecret: "" # keys: accessKey, secretKey; s3.json if embedded S3 is enabled
  accessKey: ""
  secretKey: ""
  retentionRules:
    enabled: true
    schedule: "0 * * * *"
    image:
      repository: ghcr.io/atticplaygroup/paid-services/s3-retention-rules
      tag: ""
      pullPolicy: IfNotPresent
    region: us-east-1
    # Inclusive range; matches the application's ten-day retention units.
    minDays: 10
    maxDays: 3650
    stepDays: 10
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
redisAddress: "" # kvstore-redis:6379
env:
  tlsSecretName: ""
  validAudience: "" # bahi5mayseakgxo3yvoqqco7lttd7c7mzxvos4f45ffo4jv27fgctrrgc2rv3s
  validCoinType: 1
  validCoinEnvironment: 4
  faucetMode: false
  accountDomains: []
  # - account.test-kvstore.com
  # - account.envoy
  deductionLogName: kvstore_deduction
  providerManifest: "{}"
meter:
  fullnameOverride: kvstore-meter
  redis:
    enabled: false
    seedJobEnabled: true
    host: "" # host: kvstore-redis
    address: "" # address: kvstore-redis:6379
  account:
    validAudience: "" # bahi5mayseakgxo3yvoqqco7lttd7c7mzxvos4f45ffo4jv27fgctrrgc2rv3s
    validCoinType: 1
    validCoinEnvironment: 4
    faucetMode: false
  deduction:
    feedbackEnabled: false
    feedbackTTLSeconds: 10
    outproxyAddress: ""
  authz:
    allowZeroBalanceHTUs:
      - /kvstore.v1.MeteredStorageService/Ping
      - /account.v1.AccountService/DepositOrCreateAccount
      - /account.v1.AccountService/CreditBalance
  priceSeed:
    entries:
      - key: p:3:1
        fields:
          METER_TYPE_GET: "0"
          METER_TYPE_SET: "0"
      - key: p:3:3
        fields:
          METER_TYPE_GET: "0"
          METER_TYPE_SET: "0"
