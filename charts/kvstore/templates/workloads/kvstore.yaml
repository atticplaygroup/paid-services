apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kvstore.fullname" . }}-kvstore
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: {{ include "kvstore.fullname" . }}-kvstore }
  template:
    metadata:
      labels: { app: {{ include "kvstore.fullname" . }}-kvstore }
    spec:
      enableServiceLinks: false
      containers:
        - name: kvstore
          image: "{{ required "kvstore.image.repository is required" .Values.image.repository }}:{{ (.Values.image.tag | default .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/kvstore"]
          env:
            - { name: MINIO_ENDPOINT, value: {{ include "kvstore.s3Endpoint" . | quote }} }
            - { name: S3_SECURE, value: {{ .Values.s3.secure | quote }} }
            - { name: MINIO_BUCKET, value: {{ .Values.s3.bucket | quote }} }
            - { name: MINIO_ACCESS_KEY, valueFrom: { secretKeyRef: { name: {{ include "kvstore.s3Secret" . }}, key: accessKey } } }
            - { name: MINIO_SECRET_KEY, valueFrom: { secretKeyRef: { name: {{ include "kvstore.s3Secret" . }}, key: secretKey } } }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 2
          volumeMounts:
            - { name: kvstore-config, mountPath: /.env, subPath: .env }
      volumes:
        - name: kvstore-config
          configMap: { name: {{ include "kvstore.fullname" . }}-kvstore-config }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kvstore.fullname" . }}-kvstore
  namespace: {{ .Release.Namespace }}
spec:
  selector: { app: {{ include "kvstore.fullname" . }}-kvstore }
  ports:
    - { name: http, port: 8080, targetPort: http }
