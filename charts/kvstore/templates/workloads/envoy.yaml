apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kvstore.fullname" . }}-envoy
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: {{ include "kvstore.fullname" . }}-envoy }
  template:
    metadata:
      labels: { app: {{ include "kvstore.fullname" . }}-envoy }
    spec:
      containers:
        - name: envoy
          image: "{{ .Values.envoyImage.repository }}:{{ .Values.envoyImage.tag }}"
          imagePullPolicy: {{ .Values.envoyImage.pullPolicy }}
          args: ["-c", "/etc/envoy/envoy.yaml"]
          ports:
            - { name: http, containerPort: 8080 }
            {{- if .Values.env.tlsSecretName }}
            - { name: https, containerPort: 8443 }
            {{- end }}
            - { name: admin, containerPort: 9901 }
          volumeMounts:
            - { name: envoy-config, mountPath: /etc/envoy }
            {{- if .Values.env.tlsSecretName }}
            - { name: tls, mountPath: /etc/envoy/tls, readOnly: true }
            {{- end }}
      volumes:
        - name: envoy-config
          configMap: { name: {{ include "kvstore.fullname" . }}-envoy-config }
        {{- if .Values.env.tlsSecretName }}
        - name: tls
          secret: { secretName: {{ .Values.env.tlsSecretName }} }
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kvstore.fullname" . }}-envoy
  namespace: {{ .Release.Namespace }}
spec:
  selector: { app: {{ include "kvstore.fullname" . }}-envoy }
  ports:
    - { name: http, port: 8080, targetPort: http }
    {{- if .Values.env.tlsSecretName }}
    - { name: https, port: 8443, targetPort: https }
    {{- end }}
