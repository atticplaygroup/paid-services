{{- if not .Values.s3.existingSecret }}
{{- $accessKey := required "s3.accessKey is required unless s3.existingSecret is supplied" .Values.s3.accessKey }}
{{- $secretKey := required "s3.secretKey is required unless s3.existingSecret is supplied" .Values.s3.secretKey }}
{{- $identities := list (dict "name" "kvstore" "credentials" (list (dict "accessKey" $accessKey "secretKey" $secretKey)) "actions" (list "Admin" "Read" "Write" "List" "Tagging")) }}
{{- $readAccessKey := "" }}
{{- $readSecretKey := "" }}
{{- if and .Values.s3.enabled .Values.s3.directAccess.enabled }}
{{- if .Values.s3.directAccess.existingSecret }}
{{- fail "embedded S3 with s3.directAccess.existingSecret also requires s3.existingSecret containing the configured read-only identity" }}
{{- end }}
{{- $readSecret := lookup "v1" "Secret" .Release.Namespace (include "kvstore.s3ReadOnlySecret" .) }}
{{- if $readSecret }}
{{- $readAccessKey = index $readSecret.data "accessKey" | b64dec }}
{{- $readSecretKey = index $readSecret.data "secretKey" | b64dec }}
{{- else }}
{{- $readAccessKey = randAlphaNum 20 }}
{{- $readSecretKey = randAlphaNum 40 }}
{{- end }}
{{- $identities = append $identities (dict "name" "direct-readonly" "credentials" (list (dict "accessKey" $readAccessKey "secretKey" $readSecretKey)) "actions" (list (printf "Read:%s" .Values.s3.bucket) (printf "List:%s" .Values.s3.bucket))) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kvstore.fullname" . }}-s3
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  accessKey: {{ $accessKey | quote }}
  secretKey: {{ $secretKey | quote }}
  s3.json: |
    {{ dict "identities" $identities | toJson }}
{{- if and .Values.s3.enabled .Values.s3.directAccess.enabled (not .Values.s3.directAccess.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kvstore.s3ReadOnlySecret" . }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  accessKey: {{ $readAccessKey | quote }}
  secretKey: {{ $readSecretKey | quote }}
{{- end }}
{{- end }}
