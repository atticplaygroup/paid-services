{{- if not .Values.s3.existingSecret }}
{{- $accessKey := required "s3.accessKey is required unless s3.existingSecret is supplied" .Values.s3.accessKey }}
{{- $secretKey := required "s3.secretKey is required unless s3.existingSecret is supplied" .Values.s3.secretKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kvstore.fullname" . }}-s3
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  accessKey: {{ $accessKey | quote }}
  secretKey: {{ $secretKey | quote }}
  s3.json: |
    {{ dict "identities" (list (dict "name" "kvstore" "credentials" (list (dict "accessKey" $accessKey "secretKey" $secretKey)) "actions" (list "Admin" "Read" "Write" "List" "Tagging"))) | toJson }}
{{- end }}
