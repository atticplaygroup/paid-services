# Supply the application image repository and a deployment-owned version.
ociImage:
  repository: ghcr.io/atticplaygroup/paid-services/oci
  # Defaults to Chart.appVersion; CI supplies a commit-specific tag.
  tag: ""
  pullPolicy: IfNotPresent
fullnameOverride: ""
env:
  kvstoreAddress: "" # kvstoreAddress: http://envoy:8080
  outproxyAddress: ""
  outproxyCaSecretName: ""
  deductionAddress: "" # deductionAddress: meter-deduction:9193
  deductionLogName: oci_deduction
  accountDomains: []
  deductionAmount: 1
  readOnlyMode: false
  dpopMasterSecret: ""
  tlsSecretName: ""
meter:
  fullnameOverride: meter
  redis:
    enabled: false
    seedJobEnabled: true
    host: "" # host: party-redis
    address: "" # address: party-redis:6379
