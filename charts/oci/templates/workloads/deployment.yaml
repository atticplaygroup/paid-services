apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oci.name" . }}-oci
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: {{ include "oci.name" . }}-oci }
  template:
    metadata:
      labels: { app: {{ include "oci.name" . }}-oci }
    spec:
      enableServiceLinks: false
      containers:
        - name: oci
          image: "{{ required "oci.ociImage.repository is required" .Values.ociImage.repository }}:{{ (.Values.ociImage.tag | default .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.ociImage.pullPolicy }}
          command: ["bun", "run", "src/index.ts"]
          env:
            - name: PORT
              value: "3000"
            - name: KVSTORE_ADDRESS
              value: {{ required "oci.env.kvstoreAddress must be non-empty" .Values.env.kvstoreAddress | quote }}
            {{- if .Values.env.outproxyAddress }}
            - name: OUTPROXY_ADDRESS
              value: {{ .Values.env.outproxyAddress | quote }}
            {{- end }}
            {{- if .Values.env.outproxyCaSecretName }}
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/outproxy-ca/ca.crt
            {{- end }}
            - name: DEDUCTION_ADDRESS
              value: "http://{{ required "oci.env.deductionAddress must be non-empty" .Values.env.deductionAddress }}"
            - name: DEDUCTION_AMOUNT
              value: "{{ .Values.env.deductionAmount }}"
            - name: READ_ONLY_MODE
              value: {{ .Values.env.readOnlyMode | quote }}
            - name: DPOP_MASTER_SECRET
              value: {{ required "oci.env.dpopMasterSecret must be non-empty" .Values.env.dpopMasterSecret | quote }}
          ports:
            - { name: http, containerPort: 3000 }
          {{- if .Values.env.outproxyCaSecretName }}
          volumeMounts:
            - { name: outproxy-ca, mountPath: /etc/outproxy-ca, readOnly: true }
          {{- end }}
      {{- if .Values.env.outproxyCaSecretName }}
      volumes:
        - name: outproxy-ca
          secret:
            secretName: {{ .Values.env.outproxyCaSecretName }}
            items:
              - { key: ca.crt, path: ca.crt }
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oci.name" . }}-oci
  namespace: {{ .Release.Namespace }}
spec:
  selector: { app: {{ include "oci.name" . }}-oci }
  ports:
    - { name: http, port: 3000, targetPort: http }
---
