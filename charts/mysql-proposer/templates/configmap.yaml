apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-proposer-config
  namespace: {{ .Values.namespace }}
data:
  application-manifest.yaml: |
    version: v1
    owner: {{ .Values.owner }}
    application: {{ .Values.packer.application }}
    tag: {{ now | date "20060102150405" }}
    databases:
    {{- range .Values.mysql.exportedSchemas }}
      - type: mysql:v26.5.3
        name: app-{{ . }}
        tag: {{ $.Values.packer.tag }}
        baseline:
          repo: {{ $.Values.packer.baselineRepo }}
          gtid_end: ""
        delta:
          repo: {{ $.Values.packer.deltaRepo }}
          gtid_start: ""
          gtid_end: ""
        exported_schemas:
          - {{ . }}
    {{- end }}
