apiVersion: batch/v1
kind: CronJob
metadata:
  name: mysql-proposer-packer
  namespace: {{ .Values.namespace }}
spec:
  schedule: "{{ .Values.packer.schedule }}"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: packer
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["/usr/local/bin/publish"]
              env:
                - name: MYSQL_HOST
                  value: "{{ .Values.mysql.host | default "mysql-proposer" }}"
                - name: MYSQL_PORT
                  value: "3306"
                - name: MYSQL_USER
                  value: "root"
                - name: MYSQL_PASSWORD
                  value: "{{ .Values.mysql.rootPassword }}"
                - name: MYSQL_EXPORT_SCHEMAS
                  value: "{{ join "," .Values.mysql.exportedSchemas }}"
                - name: OCI_ADDRESS
                  value: "{{ required "mysql-proposer.packer.ociAddress must be non-empty" .Values.packer.ociAddress }}"
                - name: BASELINE_REPO
                  value: "{{ .Values.packer.baselineRepo }}"
                - name: DELTA_REPO
                  value: "{{ .Values.packer.deltaRepo }}"
                - name: MANIFEST_REPO
                  value: "{{ .Values.packer.manifestRepo | default "app-manifests" }}"
                - name: APPLICATION
                  value: "{{ .Values.packer.application }}"
                - name: OWNER
                  value: "{{ .Values.owner | default "proposer" }}"
                - name: OUTPUT_DIR
                  value: "/tmp/feature4-export"
