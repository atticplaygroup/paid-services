{{- if not .Values.tls.existingProxySecret }}
{{- $name := printf "%s-proxy-tls" (include "outproxy-with-faucet.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $ca := genCA (printf "%s-proxy-ca" (include "outproxy-with-faucet.fullname" .)) 3650 }}
{{- if $existing }}
{{- $ca = buildCustomCert (index $existing.data "ca.crt") (index $existing.data "tls.key") }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
type: Opaque
data:
  ca.crt: {{ $ca.Cert | b64enc }}
  tls.crt: {{ $ca.Cert | b64enc }}
  tls.key: {{ $ca.Key | b64enc }}
---
{{- end }}
{{- if not .Values.cashier.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "outproxy-with-faucet.fullname" . }}-cashier
type: Opaque
stringData:
  config.json: {{ include "outproxy-with-faucet.cashierConfig" . | quote }}
{{- end }}

{{- if not .Values.outproxyExistingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "outproxy-with-faucet.fullname" . }}-outproxy
type: Opaque
stringData:
  DPOP_MASTER_SECRET: {{ required "dpopMasterSecret is required" .Values.dpopMasterSecret | quote }}
{{- end }}
