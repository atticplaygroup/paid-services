apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cashier.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "cashier.fullname" . }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: {{ include "cashier.fullname" . }} }
  template:
    metadata:
      labels: { app: {{ include "cashier.fullname" . }} }
    spec:
      enableServiceLinks: false
      containers:
        - name: cashier
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/bun", "run", "src/index.ts"]
          env:
            - { name: GRPC_PORT, value: {{ .Values.port | quote }} }
            - name: CASHIER_CONFIG
              value: {{ toJson (dict "accounts" .Values.accounts "accountSalt" .Values.accountSalt "defaultChainDepositAmount" .Values.defaultChainDepositAmount "defaultProviderDepositAmount" .Values.defaultProviderDepositAmount "accountOriginOverrides" .Values.accountOriginOverrides "manifestOriginOverrides" .Values.manifestOriginOverrides) | quote }}
          ports:
            - { name: http, containerPort: {{ .Values.port }} }
